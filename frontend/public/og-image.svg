<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="90%">
      <stop offset="0%" stop-color="#1d232c"/>
      <stop offset="62%" stop-color="#15181d"/>
      <stop offset="100%" stop-color="#111418"/>
    </radialGradient>
    <linearGradient id="bin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#333b45"/>
      <stop offset="100%" stop-color="#272d35"/>
    </linearGradient>
    <linearGradient id="binA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f72d8"/>
      <stop offset="100%" stop-color="#2f5bbf"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- brand mark -->
  <g transform="translate(80,72)" fill="#2F6BE0">
    <rect x="0"  y="0"  width="11" height="11" rx="3"/>
    <rect x="15" y="0"  width="11" height="11" rx="3"/>
    <rect x="30" y="0"  width="11" height="11" rx="3"/>
    <rect x="0"  y="15" width="11" height="11" rx="3"/>
    <rect x="15" y="15" width="11" height="11" rx="3" opacity="0.5"/>
    <rect x="30" y="15" width="11" height="11" rx="3"/>
    <rect x="0"  y="30" width="11" height="11" rx="3"/>
    <rect x="15" y="30" width="11" height="11" rx="3"/>
    <rect x="30" y="30" width="11" height="11" rx="3"/>
  </g>
  <text x="140" y="103" fill="#ffffff" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="30" font-weight="600">Gridfinity Studio</text>

  <text x="80" y="290" fill="#ffffff" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="68" font-weight="700">Design Gridfinity storage,</text>
  <text x="80" y="368" fill="#ffffff" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="68" font-weight="700">export <tspan fill="#2F6BE0">print-ready STLs.</tspan></text>
  <text x="80" y="438" fill="#aab2bc" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="27">Visual editor · watertight meshes · true 42&#160;mm Gridfinity spec</text>

  <!-- mini board -->
  <g transform="translate(820,150)">
    <rect x="-24" y="-24" width="360" height="340" rx="18" fill="#1c212a" stroke="#262b33"/>
    <!-- cells -->
    <g fill="none" stroke="#2e343d">
      <rect x="0" y="0" width="312" height="292" rx="8"/>
    </g>
    <rect x="8"   y="8"   width="150" height="90"  rx="8" fill="url(#binA)"/>
    <rect x="166" y="8"   width="138" height="42"  rx="8" fill="url(#bin)"/>
    <rect x="166" y="58"  width="64"  height="86"  rx="8" fill="url(#bin)"/>
    <rect x="238" y="58"  width="66"  height="40"  rx="8" fill="url(#bin)"/>
    <rect x="8"   y="106" width="96"  height="42"  rx="8" fill="url(#bin)"/>
    <rect x="8"   y="156" width="296" height="42"  rx="8" fill="url(#bin)"/>
    <rect x="8"   y="206" width="142" height="78"  rx="8" fill="url(#bin)"/>
    <rect x="158" y="206" width="146" height="78"  rx="8" fill="url(#binA)"/>
  </g>
</svg>
