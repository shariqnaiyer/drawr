name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install OCP system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libxext6 libxrender1 libsm6 libice6 libfontconfig1

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests (geometry watertightness, dimensions, API)
        run: pytest
